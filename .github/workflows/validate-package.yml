name: Validate package submission

# pull_request_target (not pull_request): needed so the workflow's
# GITHUB_TOKEN gets write access on PRs from forks, which is required to
# auto-merge them below. Safe here ONLY because this workflow never
# executes anything from the PR's own files — it treats packages.txt purely
# as data (reads added lines) and fetches external manifests over HTTP. If
# a future step ever runs code checked out from the PR, this trigger must
# be revisited.
on:
  pull_request_target:
    paths:
      - packages.txt

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Get base packages.txt
        run: git show origin/${{ github.event.pull_request.base.ref }}:packages.txt > /tmp/old_packages.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install jsonschema pyyaml

      - name: Validate newly added packages
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/validate_packages.py \
            --old /tmp/old_packages.txt \
            --new packages.txt \
            --schema schema.json \
            --github-token "$GH_TOKEN" > /tmp/validate_output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/validate_output.txt

      - name: Comment result on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.validate.outputs.exit_code }}" = "0" ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body "✅ Package validation passed. This PR will merge automatically — no further action needed."
          else
            {
              echo "❌ Package validation failed:"
              echo
              echo '```'
              cat /tmp/validate_output.txt
              echo '```'
              echo
              echo "Fix the issue in your own repo/manifest and push again to this branch — no need to open a new PR."
            } > /tmp/comment_body.txt
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body-file /tmp/comment_body.txt
          fi

      - name: Fail job if validation failed
        if: steps.validate.outputs.exit_code != '0'
        run: exit 1

  merge:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge
        id: merge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash --delete-branch \
            --repo ${{ github.repository }}

      - name: Comment if auto-merge itself failed
        if: steps.merge.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "⚠️ Validation passed, but the automatic merge itself failed (often a merge conflict with main). You may need to rebase/update this branch."

      - name: Fail job if auto-merge failed
        if: steps.merge.outcome != 'success'
        run: exit 1

      # A merge via GITHUB_TOKEN doesn't fire the build-index workflow's
      # `push` trigger (GitHub suppresses events from actions' own token to
      # prevent infinite loops) — dispatch it explicitly instead, which is a
      # direct API call and not subject to that restriction.
      - name: Trigger index rebuild
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Build package index" --repo ${{ github.repository }}
