name: Validate package submission

# pull_request_target (not pull_request): needed so the workflow's
# GITHUB_TOKEN gets write access on PRs from forks, which is required to
# auto-merge them below. Safe here ONLY because this workflow never
# executes anything from the PR's own files — it treats packages.txt purely
# as data (reads added lines) and fetches external manifests over HTTP. If
# a future step ever runs code checked out from the PR, this trigger must
# be revisited.
on:
  pull_request_target:
    paths:
      - packages.txt

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Get base packages.txt
        run: git show origin/${{ github.event.pull_request.base.ref }}:packages.txt > /tmp/old_packages.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install jsonschema pyyaml

      - name: Validate newly added packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_packages.py \
            --old /tmp/old_packages.txt \
            --new packages.txt \
            --schema schema.json \
            --github-token "$GH_TOKEN"

      - name: Auto-merge
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash --delete-branch \
            --repo ${{ github.repository }}
