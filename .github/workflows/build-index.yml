name: Build package index

# Runs on every push to main (so a merged submission is reflected right
# away) AND on a schedule (so an author-side edit to their OWN
# mpy-registry.yaml - which needs no PR here at all - eventually gets
# picked up too, since that kind of change produces no push to this repo).
on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install jsonschema pyyaml

      - name: Build index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_index.py \
            --packages packages.txt \
            --schema schema.json \
            --out /tmp/dist-out \
            --github-token "$GH_TOKEN" \
            --skipped-out /tmp/skipped.json

      - name: Alert on broken packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Broken packages (auto-generated)"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")

          if [ "$(jq 'length' /tmp/skipped.json)" -eq 0 ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "All packages passed validation on the latest rebuild."
            fi
            exit 0
          fi

          {
            echo "The nightly index rebuild found packages that no longer pass schema validation."
            echo "Each is dropped from \`index.json\` until its manifest is fixed and a rebuild picks it up again."
            echo
            jq -r '.[] | "- " + .' /tmp/skipped.json
            echo
            echo "_Updated automatically by the [build-index workflow](../actions/workflows/build-index.yml). This issue is edited in place, not reopened as new each run._"
          } > /tmp/issue-body.md

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file /tmp/issue-body.md
            gh issue reopen "$EXISTING" 2>/dev/null || true
          else
            gh issue create --title "$TITLE" --body-file /tmp/issue-body.md
          fi

      - name: Publish to dist branch
        # Builds outside the repo (/tmp/dist-out) so the dist branch's root
        # holds index.json/categories/ directly - no nested "dist/dist/..."
        # path, since the branch is already named dist.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist
          git rm -rf . > /dev/null
          git clean -fdx
          cp -r /tmp/dist-out/. .
          git add -A
          git commit -m "ops(index): regenerate dist/index.json"
          git push --force origin dist
